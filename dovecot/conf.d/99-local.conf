protocols = imap
listen = *

auth_mechanisms = plain login
auth_allow_cleartext = yes
ssl = no

passdb lua {
  lua_file = /etc/dovecot/auth.lua
}

userdb static {
  userdb_static_allow_all_users = yes
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user}
  }
}

namespace inbox {
  type = private
  separator = /
  prefix =
  inbox = yes
}

mail_driver = maildir
mail_path = /srv/vmail/%{user}/Maildir
mailbox_list_layout = Maildir++
