services:
  jupyterhub-singleuser-image:
    image: jupyterhub-singleuser-nokernel:latest
    build:
      context: ./jupyter
      dockerfile: Dockerfile.singleuser
    profiles:
      - build-only

  jupyterhub:
    build:
      context: ./jupyter/hub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub
      - ./jupyter/hub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - ./mail:/srv/vmail:ro
    environment:
      DOCKER_NETWORK_NAME: ${COMPOSE_PROJECT_NAME:-tempemail}_default
      DOCKER_JUPYTER_IMAGE: jupyterhub-singleuser-nokernel:latest
    secrets:
      - jupyterhub_admin_password
      - group_password

  caddy:
    image: caddy:2.10
    env_file:
      - .env
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./html/public:/srv/html/public:ro
      - ./html/Repos:/srv/html/Repos:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - roundcube
      - jupyterhub
      - acme-le-bash
      - php
    restart: unless-stopped
    secrets:
      - group_password
    command: >
      sh -c '
        HASH=$$(caddy hash-password --plaintext "$$(cat /run/secrets/group_password)")
        export CADDY_AUTH_HASH=$$HASH
        exec caddy run --config /etc/caddy/Caddyfile
      '

  php:
    build:
      context: ./php
    working_dir: /srv/html
    user: "${UID}:${GID}"
    volumes:
      - ./html/public:/srv/html/public:ro
      - ./html/teams:/srv/html/teams
      - ./html/Repos:/srv/html/Repos
      - ./mail:/srv/html/mail:ro
    secrets:
      - github_token
      - github_webhook_secret
    env_file:
      - .env
    environment:
      HOME: /home/app
      XDG_CONFIG_HOME: /home/app/.config
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/local/bin/git-askpass
    restart: unless-stopped

  setup:
    build: ./setup
    user: "${UID}:${GID}"
    restart: unless-stopped
    volumes:
      - ./state/setup:/state
      - ./html/teams:/teams
    env_file:
      - .env
    secrets:
      - github_token
    command: >
      bash -lc '
        while true
        do
          ./setup.sh;
          sleep 60;
        done
      '

  dovecot:
    image: dovecot/dovecot:latest
    volumes:
      - ./mail:/srv/vmail
      - ./dovecot/conf.d:/etc/dovecot/conf.d
      - ./dovecot/auth.lua:/etc/dovecot/auth.lua:ro
    secrets:
      - group_password
    restart: unless-stopped

  roundcube:
    image: roundcube/roundcubemail:latest
    ports:
      - "8080:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=dovecot
      - ROUNDCUBEMAIL_DEFAULT_PORT=31143
      # No SMTP
    depends_on:
      - dovecot
    restart: unless-stopped

  getmail:
    build:
      context: ./getmail
    env_file:
      - .env
    secrets:
      - upstream_imap_password
      - github_token
        #    user: "${UID}:${GID}"
    environment:
      - HOME=/home/getmail
    volumes:
      - ./getmail/config:/etc/getmail:ro
      - ./mail:/srv/vmail
      - ./state/getmail:/var/lib/getmail
      - ./allowed-emails.txt:/home/getmail/allowed-emails.txt
    command: >
      sh -lc '
        envsubst < /etc/getmail/getmailrc.template > /home/getmail/getmailrc &&
        while true
        do
          getmail --getmaildir=/var/lib/getmail --rcfile /home/getmail/getmailrc;
          sleep 60;
        done
      '
    restart: unless-stopped

  acme-le-bash:
    build:
      context: ./acme-le-bash
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: "admin@${DOMAIN}"
      FQDNS: "${DOMAIN} jupyter.${DOMAIN} email.${DOMAIN} *.pages.${DOMAIN}"
      PAGESFQDN: "pages.${DOMAIN}"
      AWS_CONFIG_FILE: /run/secrets/aws_config
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    secrets:
      - aws_credentials
    volumes:
      - ./certs:/certs
    working_dir: /app/acme-le-bash
    command: >
      bash -lc '
        ./checkdns.sh || exit 1
        while true
        do

          reqfunction() {
            /app/acme-le-bash/acme.sh -C "$1" -k "$2" $$VERBOSE -DAWS -e "$$ACME_EMAIL" $${FQDNS[@]}
          }
          export -f reqfunction
          ./monitorCert.sh -v -capath /etc/ssl/certs -cert /certs/site.crt -key /certs/site.key $$FQDNS
          # Try a hack to get round wildcard and non wildcard clash. when acme-le-bash fixes this issue just add pages.domain to FQDNS
          reqfunction() {
            /app/acme-le-bash/acme.sh -C "$1" -k "$2" $$VERBOSE -DAWS -e "$$ACME_EMAIL" $${PAGESFQDN[@]}
          }
          export -f reqfunction
          ./monitorCert.sh -v -capath /etc/ssl/certs -cert /certs/pages.crt -key /certs/pages.key $$PAGESFQDN

          sleep 86400
        done
      '
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /certs/site.crt && test -s /certs/site.key && openssl x509 -in /certs/site.crt -noout >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m

volumes:
  caddy_data:
  caddy_config:
  jupyterhub-data:

secrets:
  upstream_imap_password:
    file: ./secrets/imap_password.txt
  aws_credentials:
    file: ./secrets/aws-credentials
  aws_config:
    file: ./secrets/aws-config
  group_password:
    file: ./secrets/group_password.txt
  jupyterhub_admin_password:
    file: ./secrets/jupyterhub_admin_password.txt
  github_token:
    file: ./secrets/github_token.txt
  github_webhook_secret:
    file: ./secrets/github_webhook_secret.txt
